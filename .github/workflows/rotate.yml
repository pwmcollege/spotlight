name: Rotate Challenges

on:
  schedule:
    - cron: "21 6 * * 0"
      timezone: America/Los_Angeles
  workflow_dispatch:

env:
  DOJO_ID: ${{ vars.DOJO_ID }}
  COMMUNITY_COUNT: "10"
  OFFICIAL_COUNT: "10"
  ALLOW_COURSE_DOJOS: "false"

concurrency: spotlight-rotation

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          ssh-key: ${{ secrets.ROTATE_DEPLOY_KEY }}

      - name: Select challenges
        run: |
          python -m pip install --upgrade -q -r requirements.txt
          python scripts/rotate.py "${DOJO_ID:?Set the DOJO_ID repository variable}" ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit the selection
        run: |
          git add community official history.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Rotate Spotlight for $(date -u +%F)"
          git push origin HEAD
