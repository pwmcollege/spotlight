name: Prune Legacy Awards

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Update Dojo]
    types: [completed]

jobs:
  prune:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        vars.AUTO_PRUNE_LEGACY_AWARDS == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_commit.author.email == '41898282+github-actions[bot]@users.noreply.github.com'
      )
    runs-on: ubuntu-latest
    env:
      DOJO_API_TOKEN: ${{ secrets.DOJO_API_TOKEN }}
      DOJO_ID: ${{ vars.DOJO_ID }}
    steps:
      - run: |
          curl -fsS -H "Authorization: Token ${DOJO_API_TOKEN:?Set the DOJO_API_TOKEN repository secret}" \
            -H 'Content-Type: application/json' -d '{}' \
            "https://pwn.college/pwncollege_api/v1/dojos/${DOJO_ID}/awards/prune"
